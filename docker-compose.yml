# Single-node deployment with SQLite on a named volume.
# For Postgres, see docs/DEPLOYMENT.md (one-line provider swap in
# prisma/schema.prisma, then uncomment the db service below).

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/isinvestment.db"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -base64 32)}"
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # db:
